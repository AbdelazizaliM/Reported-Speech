<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Special Reporting Verbs – Excel in English</title>
<style>
:root{--ink:#1f2340;--ok:#16a34a;--bad:#e11d48;--gold:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;background:linear-gradient(135deg,#4338ca,#9333ea 40%,#db2777 75%,#f97316);background-size:300% 300%;animation:bg 16s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.bub{position:fixed;bottom:-80px;border-radius:50%;background:rgba(255,255,255,.14);animation:rise linear infinite;pointer-events:none;z-index:0}
@keyframes rise{to{transform:translateY(-120vh) rotate(180deg)}}
header,footer{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:rgba(20,10,60,.55);color:#fff;font-weight:700}
header span,footer span{padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.16);font-size:.95rem}
header span:nth-child(1){background:#f59e0b;color:#2b1a00}
header span:nth-child(2){background:#22d3ee;color:#00303a}
header span:nth-child(3){background:#a3e635;color:#1b2a00}
header span:nth-child(4){background:#f472b6;color:#3a0020}
footer{font-size:.85rem}
main{position:relative;z-index:1;flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 14px 24px}
.hud{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;margin-bottom:10px;flex-wrap:wrap}
.hud .grow{flex:1;min-width:120px}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#fde047,#4ade80,#22d3ee);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.pill{background:rgba(0,0,0,.28);border-radius:99px;padding:4px 12px}
.hearts{letter-spacing:2px}
.card{background:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 14px 0 rgba(0,0,0,.18);animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;margin-bottom:10px;color:#fff}
.t-m{background:#7c3aed}.t-g{background:#0891b2}
h1{font-size:clamp(1.9rem,6vw,2.7rem);margin:.1em 0;text-align:center;background:linear-gradient(90deg,#4338ca,#db2777,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:.2em 0 .5em}
.mascot{font-size:4.2rem;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.q{font-size:1.28rem;line-height:1.55;margin:4px 0 14px;font-weight:600}
.src{background:#f5f3ff;border-left:6px solid #7c3aed;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-style:italic;font-size:1.1rem}
.hint{font-size:.95rem;color:#5b5f86;margin:-6px 0 12px}
.blank{display:inline-block;min-width:90px;border-bottom:4px dashed #f59e0b;text-align:center;color:#c2410c;font-weight:800;animation:blink 1.4s infinite}
.blank.done{border-bottom-style:solid;animation:none;color:var(--ok)}
@keyframes blink{50%{border-color:#ec4899}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:700;font-size:1.12rem;color:#fff;border:0;border-radius:18px;padding:15px 12px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s,opacity .3s}
.opt:hover:not(:disabled){transform:translateY(-3px) scale(1.03)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.o0{background:#6366f1}.o1{background:#ec4899}.o2{background:#f59e0b;color:#2b1a00}.o3{background:#0ea5e9}
.opt.right{background:var(--ok);color:#fff;animation:jump .6s}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .45s}
.opt:disabled:not(.right):not(.wrong){opacity:.4}
@keyframes jump{30%{transform:scale(1.15) rotate(-3deg)}60%{transform:scale(1.08) rotate(3deg)}}
.gap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.2rem;font-weight:700}
.gap input{flex:1;min-width:200px;font:inherit;font-weight:600;padding:12px 14px;border-radius:16px;border:3px solid #a5b4fc;outline:0}
.gap input:focus{border-color:#ec4899;box-shadow:0 0 0 5px rgba(236,72,153,.2)}
.gap input.right{border-color:var(--ok);background:#f0fdf4}
.gap input.wrong{border-color:var(--bad);background:#fff1f2}
.btn{font:inherit;font-weight:800;font-size:1.1rem;color:#fff;border:0;border-radius:99px;padding:13px 28px;cursor:pointer;background:linear-gradient(90deg,#ec4899,#f97316);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .15s}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.btn:active{transform:translateY(3px)}
.btn.alt{background:linear-gradient(90deg,#0891b2,#22c55e)}
.fb{margin-top:16px;padding:12px 16px;border-radius:16px;font-weight:700;font-size:1.05rem;animation:pop .35s}
.fb.ok{background:#dcfce7;color:#14532d}.fb.no{background:#ffe4e6;color:#881337}
.fb .btn{margin-top:10px;display:block}
.stars{font-size:3rem;text-align:center;letter-spacing:6px}
.stars b{display:inline-block;animation:spin .8s both}
.stars b:nth-child(2){animation-delay:.25s}.stars b:nth-child(3){animation-delay:.5s}
@keyframes spin{from{transform:scale(0) rotate(-360deg)}}
.center{text-align:center}
.lv{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.lv div{flex:1;min-width:150px;padding:12px;border-radius:18px;color:#fff;font-weight:700}
.quote{margin:14px 0 0;padding:12px 16px;border-radius:16px;background:#fef3c7;color:#78350f;font-style:italic;text-align:left}
.conf{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:9;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header><span>Excel in English</span><span>Mod 5</span><span>Term 1</span><span>2026/2027</span></header>
<main id="app"></main>
<footer><span>Abdelaziz Elshenbary</span><span>77895676</span><span>practice makes perfect</span></footer>
<script>
const P=["to-inf","sb + to-inf","-ing form","that-clause"];
const pat=(v,ex,a)=>({t:"m",q:"Which pattern follows “"+v+"”?",s:ex,o:P,a:a});
const mc=(q,o,a)=>({t:"m",q:q,o:o,a:a});
const g=(s,p,m,k)=>({t:"g",s:s,p:p,m:m,k:k});
const mix=(a,b)=>{const r=[],n=Math.max(a.length,b.length);for(let i=0;i<n;i++){if(a[i])r.push(a[i]);if(b[i])r.push(b[i])}return r};

const M=[
mc("The math teacher ______ how to solve the problem in a very smooth way.",["said","asked","suggested","explained"],3),
mc("The thief ______ stealing the money, so he was free.",["denied","admitted","suggested","explained"],0),
mc("The teacher ______ us not to forget the book.",["fought","warned","promised","admitted"],1),
mc("The teacher ______ us to get prepared for the quiz.",["urged","agreed","offered","admitted"],0),
mc("“If you lie, I’ll punish you,” said Noha.<br>Noha ______ to punish me if I lied.",["invited","threatened","suggested","promised"],1),
mc("“Don’t forget to phone Ali,” said Mum.<br>Mum ______ me to phone Ali.",["warned","promised","reminded","threatened"],2),
mc("“Don’t fly kites near electricity,” said my father.<br>He ______ me not to fly kites near electricity.",["invited","warned","promised","threatened"],1),
mc("“We really must go with you,” they said.<br>They ______ on going with me.",["insisted","invited","reminded","threatened"],0),
mc("“Please, please don’t tell anyone!” he said.<br>He ______ me not to tell anyone.",["invited","begged","reminded","threatened"],1),
mc("“You should have lessons,” she said.<br>She ______ me to have lessons.",["warned","advised","suggested","threatened"],1),
mc("“I didn’t do it,” he said.<br>He ______ doing it.",["denied","invited","refused","threatened"],0),
mc("“I won’t do it,” he said.<br>He ______ to do it.",["denied","invited","refused","threatened"],2),
mc("Omar ______ going out and we agreed.",["denied","warned","boasted","suggested"],3),
mc("The reporter ______ him why he had decided to participate in the Olympic Games.",["asked","said to","wanted","wondered"],0),
mc("He told the reporter that his trainer ______ him to win.",["help","helped","will help","has helped"],1),
mc("The trainer ______ us to attend the training on time.",["helped","explained","wondered","encouraged"],3),
mc("Abdullah advised me ______ so much time on my smart phone.",["spend","to spend","spending","have spent"],1)
];
const G=[
g("“I want to speak to the manager,” he told me.","He demanded","to speak to the manager.",[["to speak","manager"]]),
g("“All right, I’ll help with your homework,” he said.","He agreed","to help with my homework.",[["to help","homework"]]),
g("“I didn’t take your pen,” he said.","He denied","taking my pen.",[["taking","pen"],["taken","pen"],["took","pen"]]),
g("“Let’s take the kids to the theme park,” he said.","He suggested","taking the kids to the theme park.",[["taking","theme park"],["take","theme park"]]),
g("“Yes, driving to York is a good idea,” he said.","He agreed","that driving to York was a good idea.",[["york","good idea"]]),
g("“No, I didn’t steal the bag,” Mike said.","Mike denied","stealing the bag.",[["stealing","bag"],["stolen","bag"]]),
g("“Would you like to come with us?” Ali said to Gamal.","Ali invited Gamal","to come with them.",[["to come"]]),
g("“I didn’t break your camera,” Ali said to Noha.","Ali denied","breaking Noha’s camera.",[["breaking","camera"],["broken","camera"]]),
g("The teacher said to us, “Do not forget your books.”","The teacher warned us","not to forget our books.",[["not to forget","book"]]),
g("The teacher said to us, “Get prepared for your quiz, tomorrow.”","The teacher urged us","to get prepared for our quiz the next day.",[["to get prepared","quiz"],["to prepare","quiz"]]),
g("Amr said to Ola, “You can go now.”","Amr allowed Ola","to go then.",[["to go"]]),
g("“Let’s take them to the park,” he said.","He suggested","taking them to the park.",[["taking","park"],["take","park"]]),
g("“I’ll pick you up tonight,” Jack told James.","Jack promised James","to pick him up that night.",[["to pick","up"]]),
g("“I won’t eat this food,” Jack said.","Jack refused","to eat that food.",[["to eat","food"]]),
g("“You cannot use my car for the next month,” she said to me.","She forbade me","to use her car for the following month.",[["to use","car"]]),
g("“If I were you, I would walk to school,” she said to me.","She advised me","to walk to school.",[["to walk","school"]]),
g("“You should follow my instructions,” she said to me.","She advised me","to follow her instructions.",[["to follow","instructions"]])
];
const T=[
pat("refuse","“No, I won’t help with your campaign.”",0),
g("“No, I won’t help with your campaign.”","He refused","to help with my campaign.",[["to help","campaign"]]),
pat("advise","“You should ask an expert.”",1),
g("“Would you like me to record the video for you?”","He offered","to record the video for me.",[["to record","video"]]),
pat("apologise for","“I’m sorry I dropped litter in the park.”",2),
g("“You should ask an expert.”","He advised me","to ask an expert.",[["to ask","expert"]]),
pat("explain","“The volcano is no longer active.”",3),
g("“I’m sorry I dropped litter in the park.”","He apologised for","dropping litter in the park.",[["dropping","litter"]]),
pat("warn","“Don’t walk too far into the forest.”",1),
pat("accuse sb of","“You cut down those trees!”",2)
];
const LV=[
{n:"Pattern Detectives",e:"🕵️",c:"#7c3aed",q:T},
{n:"Verb Rescue",e:"🚀",c:"#0891b2",q:mix(M.slice(0,9),G.slice(0,5))},
{n:"Reporting Champions",e:"🏆",c:"#db2777",q:mix(M.slice(9),G.slice(5))}
];
const PRAISE=["Brilliant!","Spot on!","You nailed it!","Superb!","Great job!","Yes! Keep going!"];
const $=document.getElementById("app");
let lv=0,i=0,lives=5,score=0,streak=0,right=0,total=0,qs=[],sound=true;

(function(){for(let k=0;k<14;k++){const b=document.createElement("div");b.className="bub";const s=20+Math.random()*70;b.style.cssText="width:"+s+"px;height:"+s+"px;left:"+Math.random()*100+"%;animation-duration:"+(9+Math.random()*14)+"s;animation-delay:-"+Math.random()*20+"s";document.body.appendChild(b)}})();
let AC;function beep(f,d){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.frequency.value=f;v.gain.value=.07;o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function confetti(){const cs=["#f59e0b","#ec4899","#22d3ee","#a3e635","#6366f1"];for(let k=0;k<26;k++){const c=document.createElement("div");c.className="conf";c.style.background=cs[k%5];c.style.left="50%";c.style.top="40%";c.style.setProperty("--x",(Math.random()*600-300)+"px");c.style.setProperty("--y",(Math.random()*500-250)+"px");document.body.appendChild(c);setTimeout(()=>c.remove(),1000)}}
const norm=s=>s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function hud(){const L=LV[lv];return '<div class="hud"><span class="pill">'+L.e+' Level '+(lv+1)+': '+L.n+'</span><div class="grow"><div class="bar"><i id="pb" style="width:'+(i/qs.length*100)+'%"></i></div></div><span class="pill hearts">'+"❤️".repeat(lives)+"🖤".repeat(5-lives)+'</span><span class="pill">⭐ '+score+'</span>'+(streak>=3?'<span class="pill">🔥 '+streak+'</span>':'')+'<button class="pill" style="border:0;color:#fff;cursor:pointer" onclick="sound=!sound;this.textContent=sound?\'🔊\':\'🔇\'">'+(sound?"🔊":"🔇")+'</button></div>'}

function home(){lv=0;score=0;right=0;total=0;$.innerHTML='<div class="card center"><div class="mascot">🦉</div><h1>Special Reporting Verbs</h1><p class="q">Grade 12 · Choose the best answer or fill in the gap. Beat three levels without losing all your hearts!</p><div class="lv">'+LV.map((l,k)=>'<div style="background:'+l.c+'">'+l.e+' Level '+(k+1)+'<br>'+l.n+'</div>').join("")+'</div><button class="btn" onclick="start(0)">Let’s play!</button></div>'}
function start(n){lv=n;i=0;lives=5;streak=0;qs=LV[n].q.map(x=>{if(x.t==="m"){const o=shuffle(x.o.map((t,k)=>({t:t,c:k===x.a})));return Object.assign({},x,{oo:o})}return x});show()}

function show(){const x=qs[i];let h=hud()+'<div class="card" id="card"><span class="tag t-'+x.t+'">'+(x.t==="m"?"Choose the best answer":"Fill in the gap")+'</span>';
if(x.t==="m"){h+=(x.s?'<div class="src">'+x.s+'</div>':'')+'<div class="q">'+x.q.replace(/_{3,}/,'<span class="blank" id="bl">&nbsp;&nbsp;?&nbsp;&nbsp;</span>')+'</div><div class="opts">'+x.oo.map((o,k)=>'<button class="opt o'+k+'" onclick="pick('+k+')">'+o.t+'</button>').join("")+'</div>'}
else{h+='<div class="src">'+x.s+'</div><div class="hint">Report it. Think about the pattern after the verb.</div><div class="gap"><span>'+x.p+'</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…"><button class="btn alt" id="ck" onclick="check()">Check</button></div>';setTimeout(()=>{const e=document.getElementById("in");e&&e.focus();e&&e.addEventListener("keydown",ev=>{if(ev.key==="Enter")check()})},60)}
$.innerHTML=h+'<div id="fb"></div></div>'}

function done(ok,model){total++;const c=document.getElementById("card");
if(ok){right++;streak++;score+=10+Math.min(streak,5)*2;beep(660,.12);setTimeout(()=>beep(880,.15),110);confetti()}else{streak=0;lives--;beep(180,.3);c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}
const last=i===qs.length-1,dead=lives<=0;
document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"🎉 "+PRAISE[Math.floor(Math.random()*PRAISE.length)]+" +"+(10+Math.min(streak,5)*2):"✏️ Not quite. Answer: "+model)+'<button class="btn '+(ok?'':'alt')+'" onclick="'+(dead?"fail()":last?"finish()":"next()")+'">'+(dead?"Oh no, out of hearts":last?"Finish level":"Next")+'</button></div>'}
function pick(k){const x=qs[i],bs=document.querySelectorAll(".opt");bs.forEach((b,j)=>{b.disabled=true;if(x.oo[j].c)b.classList.add("right");else if(j===k)b.classList.add("wrong")});const bl=document.getElementById("bl");if(bl){bl.textContent=x.oo.find(o=>o.c).t;bl.classList.add("done")}done(x.oo[k].c,x.oo.find(o=>o.c).t)}
function check(){const x=qs[i],e=document.getElementById("in"),n=norm(e.value);if(!n){e.focus();return}const ok=x.k.some(a=>a.every(w=>n.indexOf(w)>-1));e.disabled=true;e.classList.add(ok?"right":"wrong");document.getElementById("ck").style.display="none";done(ok,x.p+" "+x.m)}
function next(){i++;show()}
function finish(){const r=right,pc=r/total;const st=pc>.85?3:pc>.65?2:1;
$.innerHTML='<div class="card center"><div class="mascot">'+(st===3?"🦉🏅":"🦉")+'</div><h2>Level '+(lv+1)+' complete!</h2><div class="stars">'+[0,1,2].map(k=>'<b>'+(k<st?"⭐":"☆")+'</b>').join("")+'</div><p class="q">Score: '+score+' · Hearts left: '+lives+'</p><button class="btn" onclick="'+(lv<2?"nextLevel()":"end()")+'">'+(lv<2?"Next level":"See my trophy")+'</button></div>';confetti();right=right}
function nextLevel(){start(lv+1)}
function fail(){$.innerHTML='<div class="card center"><div class="mascot">😵</div><h2>Out of hearts!</h2><p class="q">Every mistake is practice. Try this level again.</p><button class="btn" onclick="start('+lv+')">Try again</button></div>'}
function end(){$.innerHTML='<div class="card center"><div class="mascot">🏆</div><h1>You did it!</h1><p class="q">Total score: <b>'+score+'</b> ⭐</p><div class="quote">Verily, from the perfection of Islam is that a person leaves what does not concern him.</div><div class="quote">None of you will have faith until he loves for his brother what he loves for himself.</div><p class="q">Best wishes</p><button class="btn" onclick="home()">Play again</button></div>';confetti();setTimeout(confetti,500)}
home();
</script>
</body>
</html>
